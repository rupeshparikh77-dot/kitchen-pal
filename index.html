<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Open Kitchen — Recipes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#faf7f2;
    --card:#ffffff;
    --ink:#2c2420;
    --muted:#8a7d72;
    --line:#ece4d8;
    --accent:#d9541e;
    --accent-soft:#fbe9df;
    --chip:#f3ece2;
    --shadow:0 1px 2px rgba(44,36,32,.04),0 8px 24px rgba(44,36,32,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* Header */
  header.site{
    padding:46px 0 26px;text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fff,transparent);
  }
  .brand{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:-.5px;margin:0}
  .brand .dot{color:var(--accent)}
  .tagline{color:var(--muted);margin:10px 0 0;font-size:16px}

  /* Search */
  .searchbar{max-width:620px;margin:26px auto 0;position:relative}
  .searchbar input{
    width:100%;padding:16px 18px 16px 50px;font-size:16px;
    border:1px solid var(--line);border-radius:14px;background:#fff;
    color:var(--ink);box-shadow:var(--shadow);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .searchbar svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted)}

  /* Filters */
  .filters{padding:24px 0 4px}
  .filter-row{margin-bottom:14px}
  .filter-label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:0 0 9px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    border:1px solid var(--line);background:var(--chip);color:var(--ink);
    padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer;
    transition:all .13s ease;user-select:none;white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:12px 0 0;border-top:1px dashed var(--line);margin-top:10px}
  .count{color:var(--muted);font-size:14px}
  .toolbar select{
    padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;
    color:var(--ink);font-size:14px;cursor:pointer;outline:none;
  }
  .clearbtn{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;font-weight:600;padding:9px 4px}
  .clearbtn:hover{text-decoration:underline}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;padding:26px 0 70px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .14s ease,box-shadow .14s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(44,36,32,.05),0 16px 36px rgba(44,36,32,.11)}
  .thumb{height:132px;display:flex;align-items:center;justify-content:center;font-size:54px}
  .card-body{padding:16px 17px 18px;flex:1;display:flex;flex-direction:column}
  .card h3{margin:0 0 6px;font-size:18px;font-family:Georgia,serif;line-height:1.25}
  .card p{margin:0 0 12px;font-size:13.5px;color:var(--muted);flex:1}
  .meta{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .meta b{color:var(--ink);font-weight:600}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .tag{font-size:11px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:999px;font-weight:600}

  .empty{text-align:center;padding:80px 20px;color:var(--muted)}
  .empty .big{font-size:48px;margin-bottom:10px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(32,25,20,.55);display:none;align-items:flex-start;
    justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;backdrop-filter:blur(2px)}
  .overlay.open{display:flex}
  .modal{background:#fff;max-width:720px;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3)}
  .modal-hero{height:150px;display:flex;align-items:center;justify-content:center;font-size:72px;position:relative}
  .modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.9);border:none;cursor:pointer;font-size:20px;color:var(--ink);line-height:1;
    display:flex;align-items:center;justify-content:center}
  .modal-body{padding:26px 30px 34px}
  .modal-body h2{margin:0 0 6px;font-family:Georgia,serif;font-size:28px}
  .modal-body .desc{color:var(--muted);margin:0 0 18px}
  .modal-meta{display:flex;gap:26px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}
  .modal-meta div{font-size:13px;color:var(--muted)}
  .modal-meta b{display:block;color:var(--ink);font-size:16px;font-weight:700}
  .cols{display:grid;grid-template-columns:1fr 1.4fr;gap:30px}
  .cols h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 12px}
  .ing-list{list-style:none;padding:0;margin:0}
  .ing-list li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .steps{padding:0;margin:0;list-style:none;counter-reset:step}
  .steps li{position:relative;padding:0 0 16px 40px;font-size:14.5px;counter-increment:step}
  .steps li::before{content:counter(step);position:absolute;left:0;top:-2px;width:27px;height:27px;
    background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700}
  .modal-tags{margin-top:24px;display:flex;gap:7px;flex-wrap:wrap}

  /* Download + chat */
  .recipe-actions{margin:24px 0 2px}
  .dl-btn{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .13s ease}
  .dl-btn:hover{background:var(--accent);color:#fff}
  .chat{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}
  .chat-head{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:14px}
  .chat-msgs{display:flex;flex-direction:column;gap:10px;max-height:280px;overflow-y:auto;padding:2px 2px 12px}
  .msg{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;max-width:86%;white-space:pre-wrap;word-wrap:break-word}
  .msg.bot{background:var(--chip);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.typing{opacity:.6;font-style:italic}
  .chat-input{display:flex;gap:8px;margin-top:4px}
  .chat-input input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
  .chat-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chat-input button{background:var(--accent);color:#fff;border:none;padding:0 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
  .chat-input button:disabled{opacity:.5;cursor:default}

  footer{text-align:center;padding:30px 20px 50px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}

  @media(max-width:620px){
    .cols{grid-template-columns:1fr;gap:22px}
    .modal-body{padding:22px 20px 28px}
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <h1 class="brand">The Open Kitchen<span class="dot">.</span></h1>
    <p class="tagline">A hand-picked collection of recipes from around the world.</p>
    <div class="searchbar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search recipes, ingredients, tags…" autocomplete="off">
    </div>
  </div>
</header>

<div class="wrap">
  <section class="filters">
    <div class="filter-row">
      <p class="filter-label">Meal</p>
      <div class="chips" id="f-meal"></div>
    </div>
    <div class="filter-row">
      <p class="filter-label">Cuisine</p>
      <div class="chips" id="f-cuisine"></div>
    </div>
    <div class="filter-row">
      <p class="filter-label">Dietary</p>
      <div class="chips" id="f-diet"></div>
    </div>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <div style="display:flex;align-items:center;gap:10px">
        <label style="font-size:13px;color:var(--muted)">Sort</label>
        <select id="sort">
          <option value="default">Featured</option>
          <option value="time-asc">Quickest first</option>
          <option value="time-desc">Longest first</option>
          <option value="name">Name (A–Z)</option>
        </select>
        <button class="clearbtn" id="clear">Reset</button>
      </div>
    </div>
  </section>

  <section class="grid" id="grid"></section>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<footer>Built with The Open Kitchen · {{YEAR}} · Recipes free to cook, share &amp; adapt.</footer>
<script>document.querySelector("footer").innerHTML = document.querySelector("footer").innerHTML.replace("{{YEAR}}", new Date().getFullYear());</script>

/* ---------- Build filter sets ---------- */
const MEALS   = [...new Set(RECIPES.map(r=>r.meal))].sort();
const CUISINES= [...new Set(RECIPES.map(r=>r.cuisine))].sort();
const DIETS   = [...new Set(RECIPES.flatMap(r=>r.diet))].sort();

const state = { search:"", meal:null, cuisine:null, diet:null, sort:"default" };

function makeChips(containerId, items, key){
  const c = document.getElementById(containerId);
  items.forEach(item=>{
    const el = document.createElement("div");
    el.className = "chip";
    el.textContent = item;
    el.onclick = ()=>{
      state[key] = (state[key]===item) ? null : item;
      [...c.children].forEach(ch=>ch.classList.toggle("active", ch.textContent===state[key]));
      render();
    };
    c.appendChild(el);
  });
}
makeChips("f-meal", MEALS, "meal");
makeChips("f-cuisine", CUISINES, "cuisine");
makeChips("f-diet", DIETS, "diet");

/* ---------- Filtering & rendering ---------- */
function matches(r){
  if(state.meal && r.meal!==state.meal) return false;
  if(state.cuisine && r.cuisine!==state.cuisine) return false;
  if(state.diet && !r.diet.includes(state.diet)) return false;
  if(state.search){
    const q = state.search.toLowerCase();
    const hay = [r.name, r.cuisine, r.meal, r.desc, ...r.diet, ...r.ingredients].join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function sortList(list){
  const l = [...list];
  if(state.sort==="time-asc")  l.sort((a,b)=>a.time-b.time);
  if(state.sort==="time-desc") l.sort((a,b)=>b.time-a.time);
  if(state.sort==="name")      l.sort((a,b)=>a.name.localeCompare(b.name));
  return l;
}

function render(){
  const grid = document.getElementById("grid");
  const list = sortList(RECIPES.filter(matches));
  document.getElementById("count").textContent =
    `${list.length} recipe${list.length===1?"":"s"}`;
  grid.innerHTML = "";

  if(list.length===0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="big">🔍</div>No recipes match your filters.<br>Try resetting them.</div>`;
    return;
  }

  list.forEach(r=>{
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = ()=>openModal(r);
    card.innerHTML = `
      <div class="thumb" style="background:${r.color}">${r.emoji}</div>
      <div class="card-body">
        <h3>${r.name}</h3>
        <p>${r.desc}</p>
        <div class="meta">
          <span>⏱ <b>${r.time} min</b></span>
          <span>📊 <b>${r.difficulty}</b></span>
          <span>🍽 <b>${r.serves}</b></span>
        </div>
        <div class="tagrow">
          <span class="tag">${r.cuisine}</span>
          ${r.diet.map(d=>`<span class="tag">${d}</span>`).join("")}
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

/* ---------- Modal ---------- */
function openModal(r){
  const modal = document.getElementById("modal");
  modal.innerHTML = `
    <div class="modal-hero" style="background:${r.color}">
      ${r.emoji}
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <h2>${r.name}</h2>
      <p class="desc">${r.desc}</p>
      <div class="modal-meta">
        <div><b>${r.time} min</b>Total time</div>
        <div><b>${r.difficulty}</b>Difficulty</div>
        <div><b>${r.serves}</b>Serves</div>
        <div><b>${r.cuisine}</b>Cuisine</div>
      </div>
      <div class="cols">
        <div>
          <h4>Ingredients</h4>
          <ul class="ing-list">${r.ingredients.map(i=>`<li>${i}</li>`).join("")}</ul>
        </div>
        <div>
          <h4>Method</h4>
          <ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
        </div>
      </div>
      <div class="modal-tags">
        <span class="tag">${r.meal}</span>
        <span class="tag">${r.cuisine}</span>
        ${r.diet.map(d=>`<span class="tag">${d}</span>`).join("")}
      </div>

      <div class="recipe-actions">
        <button class="dl-btn" id="dlBtn">⬇ Download PDF</button>
      </div>

      <div class="chat">
        <div class="chat-head">👩‍🍳 Ask the Kitchen Assistant</div>
        <div class="chat-msgs" id="chatMsgs">
          <div class="msg bot">Hi! Ask me anything about this recipe — substitutions, making it dairy-free or vegan, scaling servings, timings, what to serve it with…</div>
        </div>
        <form class="chat-input" id="chatForm">
          <input id="chatText" type="text" placeholder="e.g. Can you make this dairy-free?" autocomplete="off">
          <button type="submit" id="chatSend">Send</button>
        </form>
      </div>
    </div>`;
  currentRecipe = r;
  chatHistory = [];
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("dlBtn").onclick = ()=>downloadRecipePDF(r);
  document.getElementById("chatForm").onsubmit = e=>{ e.preventDefault(); sendChat(r); };
}

/* ---------- Chat ---------- */
let currentRecipe = null;
let chatHistory = [];

function addMsg(who, text, temp){
  const box = document.getElementById("chatMsgs");
  const el = document.createElement("div");
  el.className = "msg " + (who==="user" ? "user" : "bot") + (temp ? " typing" : "");
  el.textContent = text;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}

async function sendChat(r){
  const input = document.getElementById("chatText");
  const text = input.value.trim();
  if(!text) return;
  addMsg("user", text);
  chatHistory.push({ role:"user", content:text });
  input.value = "";
  const sendBtn = document.getElementById("chatSend");
  sendBtn.disabled = true;
  const typing = addMsg("bot", "Thinking…", true);
  try{
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{ "content-type":"application/json" },
      body: JSON.stringify({ recipe:r, messages:chatHistory })
    });
    const data = await res.json();
    typing.remove();
    if(!res.ok){
      addMsg("bot", data.error || "Sorry, something went wrong.");
    }else{
      addMsg("bot", data.reply);
      chatHistory.push({ role:"assistant", content:data.reply });
    }
  }catch(e){
    typing.remove();
    addMsg("bot", "Couldn't reach the assistant — the server may still be starting up. Try again in a moment.");
  }finally{
    sendBtn.disabled = false;
    document.getElementById("chatText").focus();
  }
}

/* ---------- PDF download ---------- */
function downloadRecipePDF(r){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const margin = 48;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const width = pageW - margin*2;
  let y = margin;
  const ensure = space=>{ if(y + space > pageH - margin){ doc.addPage(); y = margin; } };
  function block(text, size, style, gap){
    doc.setFont("helvetica", style||"normal");
    doc.setFontSize(size);
    doc.setTextColor(40,36,32);
    doc.splitTextToSize(text, width).forEach(ln=>{ ensure(size+4); doc.text(ln, margin, y); y += size + 4; });
    y += (gap||0);
  }
  block(r.name, 22, "bold", 6);
  block(`${r.cuisine}  ·  ${r.meal}  ·  ${r.time} min  ·  ${r.difficulty}  ·  Serves ${r.serves}`, 10, "normal", 4);
  if(r.diet && r.diet.length) block(r.diet.join("  ·  "), 10, "italic", 8);
  block(r.desc, 11, "italic", 14);
  block("Ingredients", 14, "bold", 8);
  r.ingredients.forEach(i=> block("-  " + i, 11, "normal", 0));
  y += 12;
  block("Method", 14, "bold", 8);
  r.steps.forEach((s,i)=> block((i+1) + ".  " + s, 11, "normal", 5));
  y += 14; ensure(16);
  doc.setFont("helvetica","italic"); doc.setFontSize(9); doc.setTextColor(150);
  doc.text("From The Open Kitchen", margin, y);
  doc.save(r.name.replace(/[^a-z0-9]+/gi,"-").toLowerCase().replace(/^-|-$/g,"") + ".pdf");
}
function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}
document.getElementById("overlay").onclick = e=>{ if(e.target.id==="overlay") closeModal(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- Controls ---------- */
document.getElementById("search").addEventListener("input", e=>{ state.search=e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e=>{ state.sort=e.target.value; render(); });
document.getElementById("clear").addEventListener("click", ()=>{
  state.search=""; state.meal=null; state.cuisine=null; state.diet=null; state.sort="default";
  document.getElementById("search").value="";
  document.getElementById("sort").value="default";
  document.querySelectorAll(".chip.active").forEach(c=>c.classList.remove("active"));
  render();
});

render();
</script>
